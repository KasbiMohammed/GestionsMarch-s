{% extends "base.html" %}

{% block title %}Connexion - Gestion des Marchés Publics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-building" style="font-size: 3rem; color: var(--primary-color);"></i>
                    <h3 class="mt-3">Gestion des Marchés Publics</h3>
                    <p class="text-muted">Communes Territoriales Marocaines</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Se souvenir de moi
                        </label>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> Se connecter
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <a href="#" class="text-decoration-none">Mot de passe oublié ?</a>
                </div>
                
                <div class="mt-4 pt-4 border-top">
                    <p class="text-center text-muted small">
                        Système de gestion des marchés publics conforme à la réglementation marocaine
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const button = this.querySelector('button[type="submit"]');
    const originalText = button.innerHTML;
    
    showLoading(button);
    
    try {
        const response = await fetch('/api/auth/login/json', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Stocker le token dans un cookie
            document.cookie = `access_token=${data.access_token}; path=/; max-age=1800`;
            
            showNotification('Connexion réussie !', 'success');
            
            // Rediriger vers le tableau de bord
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        } else {
            showNotification(data.detail || 'Erreur de connexion', 'danger');
        }
    } catch (error) {
        showNotification('Erreur de connexion au serveur', 'danger');
    } finally {
        hideLoading(button, originalText);
    }
});
</script>
{% endblock %}
